name: MLOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly retrain (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # ============================================================
  # CI: Lint, test, DVC pull, Feast validation, Docker build
  # ============================================================
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------
      # DVC
      # ------------------------------------------------------------
      - name: Configure DVC remote credentials
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "${{ secrets.DAGSHUB_REPO_OWNER }}"
          dvc remote modify origin --local password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Pull data (DVC)
        run: |
          dvc pull
          dvc checkout

      - name: Verify DVC data
        run: |
          echo "Checking processed data..."
          ls -lah data/processed/
          test -f data/processed/features.parquet
          echo "features.parquet found successfully."

      # ------------------------------------------------------------
      # Code quality
      # ------------------------------------------------------------
      - name: Lint (flake8)
        run: flake8 app/ src/ tests/ --max-line-length=120

      # ------------------------------------------------------------
      # Feast + tests
      # ------------------------------------------------------------
      - name: Unit tests (pytest)
        env:
          FEAST_REPO_PATH: ${{ github.workspace }}/feature_repo
        run: |
          bash scripts/feast_setup.sh
          pytest tests/ -v

      # ------------------------------------------------------------
      # Docker validation
      # ------------------------------------------------------------
      - name: Docker build (validate image builds, PRs too)
        run: docker build -t ecommerce-churn-ltv:ci .


  # ============================================================
  # SYNC: GitHub repository → DagsHub Files
  # Runs whenever main is updated
  # ============================================================
  sync-dagshub:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync GitHub repository to DagsHub
        run: |
          git remote add dagshub "https://${{ secrets.DAGSHUB_REPO_OWNER }}:${{ secrets.DAGSHUB_TOKEN }}@dagshub.com/${{ secrets.DAGSHUB_REPO_OWNER }}/${{ secrets.DAGSHUB_REPO_NAME }}.git"
          git push dagshub main


  # ============================================================
  # PUBLISH: Retraining, MLflow, Feast, and Docker Hub
  # ============================================================
  publish:
    needs: ci
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------
      # DVC
      # ------------------------------------------------------------
      - name: Configure DVC remote credentials
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "${{ secrets.DAGSHUB_REPO_OWNER }}"
          dvc remote modify origin --local password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Pull data (DVC)
        run: |
          dvc pull
          dvc checkout

      - name: Verify DVC data
        run: |
          echo "Checking processed data..."
          ls -lah data/processed/
          test -f data/processed/features.parquet
          echo "features.parquet found successfully."

      # ------------------------------------------------------------
      # Retraining + MLflow
      # ------------------------------------------------------------
      - name: Synthetic batch + retrain all models + MLflow promote
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_REPO_OWNER }}/${{ secrets.DAGSHUB_REPO_NAME }}.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_REPO_OWNER }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
          DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
          MODEL_NAME_CHURN: churn_model
          MODEL_NAME_LTV: ltv_model
          MODEL_ALIAS: champion
        run: |
          python scripts/run_retrain_cycle.py --num-rows 5000

      # ------------------------------------------------------------
      # Feast
      # ------------------------------------------------------------
      - name: Verify Feast data after retraining
        run: |
          echo "Checking processed data after retraining..."
          ls -lah data/processed/
          test -f data/processed/features.parquet
          echo "features.parquet is available for Feast."

      - name: Apply + materialize Feast
        env:
          FEAST_REPO_PATH: ${{ github.workspace }}/feature_repo
        run: |
          bash scripts/feast_setup.sh

      # ------------------------------------------------------------
      # Docker Hub
      # ------------------------------------------------------------
      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-churn-ltv
          tags: |
            type=sha
            type=raw,value=latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}